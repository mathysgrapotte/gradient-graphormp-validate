name: hclint-graphormp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ca-certificates
  - gcc_linux-64
  - gxx_linux-64
  - procps-ng
  - pip:
      - "--extra-index-url=https://download.pytorch.org/whl/cpu"
      - "torch==2.2.2+cpu"
      - "transformers==4.40.2"
      - "Cython<3"
      - "numpy==1.26.4"
      - "rdkit==2024.3.5"
      - "scikit-learn==1.5.2"
      - "pandas==2.2.3"
      - "scipy==1.13.1"
      - "huggingface_hub"
